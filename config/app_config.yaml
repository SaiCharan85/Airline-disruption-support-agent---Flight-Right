# flightright-agent configuration (SPEC §12). Sections are filled in as each step needs them.

harness:
  seed: 42

regime:
  boundary_date: "2027-10-23"     # FR-4.2: eu261_2004 before, eu261_amended_2027 from this date

# LLMs: all free (Groq + Google AI Studio free tiers; local Ollama last). Free quotas may be shared with
# other projects on the same provider account: the usage ledger hard-stops at safety_margin x limit, then
# the role falls back to the next model; when the chain is exhausted the conversation goes to handoff.
# Model availability checked 2026-10-25 against the providers' model-list APIs (all catalog models live).
# Free-tier limits are only shown per project in each console; the numbers below date from 2026-10-04..06
# and are re-confirmed from 429 headers / consoles on the first live run (Step 5).
# Newer Google models seen 2026-10-25, not yet evaluated: gemini-4-argon, gemini-3.7-flash, gemini-3.6-flash.
models:
  checked: "2026-10-25"
  limits_checked: "2026-10-29"   # gemini-3.8-flash rpd and Google input-only TPM from 429 bodies
  safety_margin: 0.9
  day_reset_utc_offset_hours: -8      # daily quotas reset at Pacific midnight
  timeout_s: 90
  cache_path: .cache/llm/cache.sqlite3
  usage_path: .cache/llm/usage.sqlite3
  providers:
    groq: {base_url: "https://api.groq.com/openai/v1", api_key_env: GROQ_API_KEY}
    google: {base_url: "https://generativelanguage.googleapis.com/v1beta/openai", api_key_env: GOOGLE_API_KEY}
    ollama: {base_url: "http://localhost:11434/v1", api_key_env: null}
  catalog:   # "<provider>:<model id>" -> family (judges must differ from the agent) + free limits
    "groq:openai/gpt-oss-120b": {family: gpt-oss, efforts: [low, medium, high], rpm: 30, rpd: 1000, tpm: 8000, tpd: 200000}
    "groq:openai/gpt-oss-20b": {family: gpt-oss, efforts: [low, medium, high], rpm: 30, rpd: 1000, tpm: 8000, tpd: 200000}
    # Groq refuses requests whose max_tokens exceeds the output-tokens-per-minute limit
    "groq:qwen/qwen3.8-27b": {family: qwen, rpm: 30, rpd: 1000, tpm: 8000, tpd: 200000, otpm: 1000}
    # rpd 20: the free tier's daily request limit reported in a 429 on 2026-10-29 (was 250)
    "google:gemini-3.8-flash": {family: gemini, efforts: [minimal, low, medium, high], rpm: 10, rpd: 20, tpm: 250000, tpm_input_only: true}
    "google:gemini-3.5-flash-lite": {family: gemini, efforts: [minimal, low, medium, high], rpm: 15, rpd: 1000, tpm: 250000, tpm_input_only: true}
    # Gemma 4 always thinks first (<thought> block); thinking_tokens is added on top of each role's cap
    # Google's free per-minute token limit counts input tokens (429 metric
    # generate_content_free_tier_input_token_count, seen 2026-10-29).
    "google:gemma-4-26b-a4b-it": {family: gemma, rpm: 15, rpd: 7200, tpm: 15000, thinking_tokens: 2048, tpm_input_only: true}
  # Draft role chains (tuned in Steps 5-8). judge_a / judge_b never share the agent's family (FR-8.8).
  roles:
    # gpt-oss first, Gemma as fallback: the scenario messages were written by gemini-3.5-flash-lite,
    # so that model is kept out of triage evaluation to avoid self-preference.
    triage: {chain: ["groq:openai/gpt-oss-20b", "google:gemma-4-26b-a4b-it"], max_tokens: 600, reasoning_effort: low}
    agent: {chain: ["groq:openai/gpt-oss-120b", "groq:openai/gpt-oss-20b"], max_tokens: 1200, reasoning_effort: low}
    judge_a: {chain: ["google:gemma-4-26b-a4b-it", "google:gemini-3.8-flash"], max_tokens: 1200, reasoning_effort: low}
    judge_b: {chain: ["groq:qwen/qwen3.8-27b", "google:gemini-3.5-flash-lite"], max_tokens: 1000, reasoning_effort: low}
    summary: {chain: ["google:gemini-3.5-flash-lite", "groq:openai/gpt-oss-20b"], max_tokens: 800, reasoning_effort: low}
    simulator: {chain: ["google:gemini-3.5-flash-lite", "google:gemma-4-26b-a4b-it"], max_tokens: 800, reasoning_effort: minimal}
    # Writes 5 passenger opening messages per request (Step 4)
    scenario_writer: {chain: ["google:gemini-3.5-flash-lite", "google:gemma-4-26b-a4b-it", "groq:openai/gpt-oss-20b"], max_tokens: 2000, reasoning_effort: minimal}

# What the agent may do without a human (FR-5.3). These are company authority limits, not legal caps:
# EU261 sets no euro cap on care. Anything above a limit becomes a handoff.
authority:
  care_voucher_max_eur: {refreshments: 15, meal: 30, hotel_night: 180, hotel_transport: 60, communications: 10}
  # Value of the care vouchers the agent issues automatically while a passenger waits.
  care_voucher_standard_eur: {refreshments: 10, meal: 20, hotel_night: 150, hotel_transport: 40}
  care_vouchers_max_total_eur: 600         # per conversation
  refund_auto_max_eur: 800                 # larger refunds need a human
  compensation_auto_initiate: false        # the agent states compensation; payment is a human/back-office step

# Conversation graph (FR-1, FR-2, FR-9).
agent:
  max_revisions: 2                 # revise up to 2 times, then hand off (FR-9.1)
  abuse_handoff_threshold: 2       # abusive messages before a human is offered (FR-2.2)
  reply_max_words: 220
  checkpoint_path: .cache/stores/checkpoints.sqlite3

# Judge Workbench (FR-16) and Judge Monitor alerts (FR-17.5).
judge:
  exemplars_enabled: true
  exemplars_k: 3                      # reviewer corrections shown to the judge per call (dev / live only)
  proposal_min_corrections: 3         # consistent corrections on a dimension before a bar change is proposed
alerts:
  min_judgements: 10                  # no alert on tiny samples
  panel_disagreement_rate: 0.3        # share of S3 panels that disagree, rolling 1 h
  judge_unavailable_rate: 0.1         # share of judgements without a trustworthy verdict, rolling 1 h
  handoff_rate: 0.6
  dedupe_minutes: 60

# Minutes until a human must acknowledge a handoff, per tier (W2 escalates after this).
sla_minutes: {S1: 240, S2: 60, S3: 15, S4: 10}

# Local stores (git-ignored). ":memory:" is used in tests.
stores:
  history_path: .cache/stores/history.sqlite3
  actions_path: .cache/stores/actions.sqlite3
