[project]
name = "flightright"
version = "0.1.0"
description = "EU261 flight-disruption support agent gated by a severity-aware, context-reading LLM judge."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.14"
# Dependencies are added step by step (`uv add ...`) as each step needs them,
# so CI stays fast and every dependency has a reason to exist.
dependencies = [
    "crewai>=1.15",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "judgekit",
    "langgraph>=1.2.18",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "pydantic>=2.11.9",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.9",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flightright"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
# Code blocks in docs are illustrative sketches (e.g. SPEC §5), not formatted source.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH"]

[tool.ruff.lint.per-file-ignores]
# Test names reference requirement IDs, e.g. test_FR_4_7_...
"tests/**" = ["N802"]
# Prompt and message templates: prose stays readable rather than split at 100 columns.
"src/flightright/agent/drafting.py" = ["E501"]
"src/flightright/agent/handoff.py" = ["E501"]
# SQL schema and statements read better unwrapped.
"src/flightright/api/store.py" = ["E501"]
"src/flightright/simulator/crew.py" = ["E501"]
# Report tables: one row per line reads better than wrapped cells.
"scripts/eval_report.py" = ["E501"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
# Live LLM tests are opt-in: `uv run pytest -m live_llm` (a later -m overrides this one).
addopts = "-ra --strict-markers --import-mode=importlib -m 'not live_llm'"
# CrewAI's own internal deprecation notices are not ours to fix.
filterwarnings = ["ignore::DeprecationWarning:crewai.*"]
markers = [
    "slow: long-running tests (deselect with -m 'not slow')",
    "live_llm: hits a real LLM API; never run in CI",
]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "scripts"]

[tool.uv.sources]
judgekit = { git = "https://github.com/SaiCharan85/JudgeKit", tag = "v0.2.0" }
