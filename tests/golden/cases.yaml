               care: [refreshments, meals, communications, hotel, hotel_transport], hotel_nights_owed: 3,
               refund_option: true, confidence: verified, articles: ["Annex 1(c)", "9(2)", "9(6)"]}

  - id: G2027-09
    title: Same weather cancellation for a passenger needing medical assistance; no hotel cap
    case: {<<: *d2027, origin_iata: AMS, final_destination_iata: IST, carrier_iata: KL, scheduled_departure: "2027-11-15T20:00:00+01:00",
           disruption_type: cancellation, cause_code: weather_unsafe, notice_given_days: 0, nights_needed: 4,
           passenger_flags: [medical_assistance]}
    expected: {regime: eu261_amended_2027, in_scope: true, compensation_eur: null, may_reduce_to_eur: null,
               care: [refreshments, meals, communications, hotel, hotel_transport], hotel_nights_owed: 4,
               refund_option: true, confidence: verified, articles: ["Annex 1(c)", "9(2)", "11(10)"]}
