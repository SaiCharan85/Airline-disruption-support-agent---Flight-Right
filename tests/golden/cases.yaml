               care: [], refund_option: true, confidence: unverified,
               articles: ["2(l)(ii)", "5(5)", "7(1)(a)", "7(3)(a)"]}
    note: >-
      Departing > 1h early fails the under-14-days window; flight taken 1h30 early -> reduced by 50 %
      (Art. 7(3)(a)). Unverified: whether that reduction is optional for the carrier or automatic.

  - id: G2027-13
