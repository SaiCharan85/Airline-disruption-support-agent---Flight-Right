  - id: G2027-10
    title: Own staff strike over pay is not extraordinary
    case: {<<: *d2027, origin_iata: MAD, final_destination_iata: BCN, carrier_iata: IB, scheduled_departure: "2027-11-15T08:00:00+01:00",
           disruption_type: cancellation, cause_code: own_staff_strike, notice_given_days: 1}
    expected: {regime: eu261_amended_2027, in_scope: true, compensation_eur: 250, may_reduce_to_eur: null,
               care: [], refund_option: true, confidence: verified,
               articles: ["5(5)", "7(1)(a)", "Annex 3(h)"]}

  - id: G2027-11
    title: Booked before 23.10.2027, departing after it (no transitional rule)
    case: {<<: *d2027, booking_date: "2027-09-01", origin_iata: FRA, final_destination_iata: LIS,
           scheduled_departure: "2027-11-05T09:00:00+01:00", disruption_type: delay, cause_code: technical_fault,
