name: CI

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    # No API keys in CI: every LLM call in tests is mocked.
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Tests (entitlement engine branch coverage >= 95 %)
        run: uv run pytest -m "not live_llm" --cov=flightright.rules --cov-branch --cov-fail-under=95

  commit-message-lint:
    # Every commit in the pushed (or PR) range; disallowed patterns come from a repository variable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          COMMIT_MSG_DISALLOWED: ${{ vars.COMMIT_MSG_DISALLOWED }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="$PR_BASE..$PR_HEAD"
          elif [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            # New branch or rewritten history: check everything reachable from the pushed commit.
            RANGE="$PUSH_AFTER"
          else
            RANGE="$PUSH_BEFORE..$PUSH_AFTER"
          fi
          echo "Checking $RANGE"
          python3 scripts/lint_commit_message.py --range "$RANGE"
